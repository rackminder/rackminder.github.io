{{ define "main" }}

<section class="legal-page" style="padding: 120px 0 80px; min-height: 100vh;">
  <div class="container container--narrow">
    <header style="margin-bottom: 2rem; text-align: center;">
      <h1>{{ .Title }}</h1>
      {{ if .Date }}
      <p class="text-muted" style="font-size: 14px; margin-top: 0.5rem;">
        Last Updated: {{ .Date.Format "January 2, 2006" }}
      </p>
      {{ end }}
    </header>

    <div class="content" style="max-width: 800px; margin: 0 auto;">
      {{ .Content }}

      {{ if .Pages }}
      <div style="margin-top: 3rem;">
        {{ range .Pages }}
        <article style="margin-bottom: 2rem; padding: 1.5rem; background: rgba(58, 63, 68, 0.6); border-radius: 12px;">
          <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
          {{ if .Description }}
          <p class="text-muted">{{ .Description }}</p>
          {{ end }}
          <p><a href="{{ .Permalink }}" class="btn btn-secondary btn-sm">Read More →</a></p>
        </article>
        {{ end }}
      </div>
      {{ end }}
    </div>
  </div>
</section>

{{ end }}
