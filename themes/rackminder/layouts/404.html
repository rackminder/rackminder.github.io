{{ define "main" }}

<section style="padding: 120px 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;">
  <div class="container" style="text-align: center;">
    <h1 style="font-size: 120px; margin-bottom: 1rem; color: #E97451;">404</h1>
    <h2 style="margin-bottom: 1rem;">Page Not Found</h2>
    <p class="text-muted" style="margin-bottom: 2rem; max-width: 600px; margin-left: auto; margin-right: auto;">
      Looks like you've wandered off the trail. The page you're looking for doesn't exist.
    </p>
    <a href="{{ .Site.BaseURL }}" class="btn btn-primary btn-lg">← Back to Home</a>
  </div>
</section>

{{ end }}
